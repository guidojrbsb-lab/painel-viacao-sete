<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores Administrativo - Viação Sete</title>
<style>
/* Painel INDICADORES ADMINISTRATIVO - Viação Sete. Gerado a partir de "INDICADORES - BANDEIRA e VIAÇÃO SETE.xlsx"
   (roteamento por nome de aba). Valores calculados pelo Excel; formatos/cores copiados da planilha; erros (#DIV/0!) viram "-". */
:root{
  --navy:#132354; --navy-dark:#0c1938; --navy-soft:#eef1f8;
  --red:#b71930; --red-dark:#8f1226; --red-soft:#fdecee;
  --bg:#f5f6f9; --card:#ffffff; --border:#e5e8f0; --border-strong:#d6dae5;
  --ink:#151b2b; --muted:#6b7280; --muted-soft:#9aa1af;
  --green1:#eafbea; --green5:#1e7d34;
  --radius-sm:9px; --radius-md:12px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(16,24,54,.05); --shadow-md:0 3px 10px rgba(16,24,54,.07); --shadow-lg:0 10px 30px rgba(16,24,54,.16);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
header.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);}
header.top .logo{height:42px;width:auto;display:block;border-radius:8px;}
header.top .divider{width:1px;height:34px;background:var(--border);}
header.top .titulo-bloco{display:flex;flex-direction:column;gap:1px;}
header.top .titulo-bloco .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;}
header.top h1{font-size:19px;color:var(--navy);margin:0;font-weight:800;line-height:1.2;letter-spacing:-.2px;}
header.top-publico{align-items:center;gap:16px;padding:12px 24px;background:var(--navy);box-shadow:var(--shadow-md);}
header.top-publico .logo{height:36px;width:auto;display:block;border-radius:8px;}
header.top-publico .divider{width:1px;height:30px;background:rgba(255,255,255,.2);}
header.top-publico h1{flex:1;font-size:15px;color:#fff;margin:0;font-weight:700;letter-spacing:-.1px;}
header.top-publico .btn-sair{background:var(--red);color:#fff;padding:8px 18px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;font-size:12.5px;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:background .15s;}
header.top-publico .btn-sair:hover{background:var(--red-dark);}
header.top-publico .btn-paineis{background:transparent;color:#fff;padding:8px 15px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;font-size:12.5px;border:1.5px solid rgba(255,255,255,.4);transition:background .15s,border-color .15s;}
header.top-publico .btn-paineis:hover{background:rgba(255,255,255,.1);border-color:#fff;}
.layout{display:flex;min-height:calc(100vh - 66px);}
nav.sidebar{width:148px;background:var(--bg);flex-shrink:0;padding:16px 10px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--border);}
nav.sidebar button{width:100%;background:transparent;border:none;border-left:3px solid transparent;color:var(--muted);padding:11px 8px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;letter-spacing:.2px;border-radius:var(--radius-sm);transition:background .15s,color .15s;}
nav.sidebar button .ic{font-size:17px;}
nav.sidebar button.active{background:var(--navy);color:#fff;border-left-color:var(--red);box-shadow:var(--shadow-sm);}
nav.sidebar button:hover:not(.active){background:var(--navy-soft);color:var(--navy);}
main{flex:1;min-width:0;padding:18px 22px 24px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.panel h2{margin:0 0 14px;font-size:13.5px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--border);padding-bottom:10px;padding-left:11px;position:relative;letter-spacing:.1px;}
.panel h2::before{content:'';position:absolute;left:0;top:1px;bottom:11px;width:3px;border-radius:2px;background:var(--navy);}
header.top .btn-voltar{margin-left:auto;background:transparent;color:var(--navy);padding:8px 16px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;font-size:12.5px;border:1.5px solid var(--border-strong);}
header.top .btn-voltar:hover{background:var(--navy-soft);border-color:var(--navy);}
.tab.hidden{display:none;}

.indp{--ia:#132354;--iad:#0c1938;--ias:#eef1f8;background:#fff;border:1px solid #e5e8f0;border-radius:16px;padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 2px rgba(16,24,54,.05);color:#151b2b;}
.indp h2{margin:0 0 14px;font-size:13.5px;font-weight:700;color:#151b2b;border-bottom:1px solid #e5e8f0;padding-bottom:10px;padding-left:11px;position:relative;letter-spacing:.1px;}
.indp h2::before{content:'';position:absolute;left:0;top:1px;bottom:11px;width:3px;border-radius:2px;background:var(--ia);}
.indp .ind-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px;}
.indp .ind-bar.fixa{position:fixed;bottom:0;left:148px;right:0;margin:0;background:#fff;border-top:1px solid #e5e8f0;box-shadow:0 -2px 10px rgba(16,24,54,.08);padding:12px 20px;z-index:50;}
.indp .ind-btn{background:var(--ia);color:#fff;border:none;padding:9px 16px;border-radius:9px;font-weight:700;font-size:12.5px;cursor:pointer;}
.indp .ind-btn:hover{background:var(--iad);}
.indp .ind-btn.sec{background:#fff;color:var(--ia);border:1.5px solid #d6dae5;}
.indp .ind-btn.sec:hover{background:var(--ias);}
.indp .ind-btn.per{background:#fff;color:#b71930;border:1.5px solid #fdecee;}
.indp .ind-btn.per:hover{background:#fdecee;}
.indp #indStatus{font-size:11.5px;color:#6b7280;flex-basis:100%;}
.indp .ind-secoes{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;}
.indp .ind-secoes button{background:#fff;border:1.5px solid #d6dae5;color:var(--ia);padding:7px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer;}
.indp .ind-secoes button.on{background:var(--ia);border-color:var(--ia);color:#fff;}
.indp .info-badge{display:inline-block;background:var(--ias);color:var(--iad);font-size:11px;font-weight:700;padding:6px 10px;border-radius:9px;margin-bottom:12px;}
.indp .ind-filtro{display:flex;align-items:center;gap:10px;margin:0 0 12px;}
.indp .ind-filtro > label{font-size:10.5px;font-weight:700;color:#6b7280;letter-spacing:.4px;text-transform:uppercase;}
.indp #anoMS{position:relative;}
.indp #anoBtn{background:#fff;border:1px solid #d6dae5;border-radius:9px;padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--ia);cursor:pointer;min-width:150px;text-align:left;}
.indp #anoBtn:hover{border-color:var(--ia);background:var(--ias);}
.indp #anoMenu{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;border:1px solid #d6dae5;border-radius:9px;box-shadow:0 10px 30px rgba(16,24,54,.16);min-width:170px;padding:6px 0;}
.indp #anoMenu.aberto{display:block;}
.indp #anoMenu label{display:flex;align-items:center;gap:8px;padding:7px 14px;font-size:12.5px;color:#151b2b;cursor:pointer;}
.indp #anoMenu label:hover{background:var(--ias);}
.indp #anoMenu .ms-rod{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #e5e8f0;margin-top:4px;padding:7px 14px 3px;font-size:11px;}
.indp #anoMenu .ms-rod a{color:var(--ia);font-weight:700;text-decoration:none;}
.indp .scroll-box{overflow:auto;max-height:72vh;border:1px solid #e5e8f0;border-radius:12px;background:#fff;}
.indp #indTabela{border-collapse:separate;border-spacing:0;font-size:11.5px;white-space:nowrap;}
.indp #indTabela td{padding:3px 8px;text-align:right;border-bottom:1px solid #fff;border-right:1px solid #fff;min-width:62px;}
.indp #indTabela td.lab{text-align:left;position:sticky;left:0;z-index:2;min-width:210px;max-width:280px;font-weight:600;border-right:2px solid #fff;}
.indp #indTabela td.txt{text-align:center;}
.indp #indTabela td.sp{min-width:31px !important;width:31px;max-width:31px;padding:0 !important;border:none !important;background:#fff !important;}
.indp #indTabela td.sp i{display:block;width:31px;height:1px;}
.indp #indTabela tr.ind-h td{color:#fff;font-weight:700;text-align:center;}
.indp #indTabela tr.ind-h td.lab{text-align:left;}
.indp #indTabela tr.gap td{height:12px;padding:0;background:#fff !important;border:none;}
.indp #indTabela.frota td{text-align:center;}
.indp #indTabela.frota td.lab{text-align:left;min-width:190px;}
@media print{.indp .ind-bar,.indp .ind-secoes,.indp .ind-filtro{display:none !important;}}

</style>
</head>

  const nPct=pares.length, nRes=anosRes.length+nPct;
  const ncols=1+meses.length+1+nRes;
  // blocos que têm pelo menos uma linha com resumo mostram o cabeçalho das colunas de resumo
  const temRes=[]; let bi=-1;
  lin.forEach(L=>{ if(L.h){ bi++; temRes[bi]=false; } else if(L.k && bi>=0 && _specLinha(L,agg)) temRes[bi]=true; });
  let h='', zebra=0, bloco=-1;
  lin.forEach(L=>{
    if(L.gap){ h+='<tr class="gap"><td colspan="'+ncols+'"></td></tr>'; return; }
    if(L.h){
      zebra=0; bloco++;
      h+='<tr class="ind-h"><td class="lab" style="background:#002060">'+_esc(L.rot)+'</td>'+
        meses.map(k=>'<td style="background:#002060">'+_rotMes(k)+'</td>').join('');
      if(temRes[bloco]){
        h+='<td class="sp" style="background:#fff"><i></i></td>'+anosRes.map(a=>'<td style="background:#002060">.'+a+'</td>').join('')+
          pares.map(p=>'<td style="background:#002060">%'+(nPct>1?' '+anosRes[p[1]].slice(2)+'/'+anosRes[p[0]].slice(2):'')+'</td>').join('');
      }
      h+='</tr>'; return;
    }
    const est=layout[L.k]||{};
    const fill=('f' in est) ? est.f : (zebra%2 ? 'D2DEEF' : 'EAEFF7'); zebra++;
    const base='background:'+(fill?'#'+fill:'#fff')+(est.b?';font-weight:700':'');
    const st=base+(est.r?';color:#ff0000':'');
    let tds='<td class="lab" style="'+st+'">'+_esc(L.rot)+'</td>';
    meses.forEach(k=>{ const c=L.c[k]; tds+='<td class="'+(c && typeof c.v==='string' && !_ehErro(c.v)?'txt':'')+'" style="'+st+'">'+_esc(_fmtCel(c))+'</td>'; });
    if(temRes[bloco]){
      const sp=_specLinha(L,agg);
      tds+='<td class="sp" style="background:#fff"><i></i></td>';
      anosRes.forEach((a,i)=>{ tds+='<td style="'+st+'">'+(sp?_esc(_fmtRes(RES[i][L.k], sp.z)):'')+'</td>'; });
      pares.forEach(p=>{
        let t='', cor='';
        if(sp){
          const x=RES[p[0]][L.k], y=RES[p[1]][L.k];
          if(x!=null && y!=null){
            if(isNaN(x)||isNaN(y)||x===0){ t='-'; }
            else { const d=y/x-1; if(!isFinite(d)) t='-'; else { t=_fmtNum(d,'0%'); cor=d<0?';color:#ff0000':';color:#000000'; } }
          }
        }
        tds+='<td style="'+base+cor+'">'+_esc(t)+'</td>';
      });
    }
    h+='<tr>'+tds+'</tr>';
  });
  return h;
}
// ==PURE-END==

function $(id){ return document.getElementById(id); }
// ---- Frota (matriz): mostra a aba como está na planilha (valores calculados, cores, células mescladas)
function _fmtData(v){ const d=new Date(Date.UTC(1899,11,30)+Math.round(v)*86400000); return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear(); }
function _fmtFrota(c){
  if(!c || c.v===undefined || c.v===null) return '';
  const v=c.v, z=c.z||'General';
  if(typeof v==='number'){
    if(_ehFmtData(z)) return _fmtData(v);
    if(z==='General') return Number.isInteger(v) ? String(v) : v.toFixed(2).replace('.',',');
    return _fmtNum(v,z);
  }
  const s=String(v).trim(); return _ehErro(s) ? '-' : s;
}
function _htmlFrota(d, L){
  const g=d.grade||[]; let h='';
  for(let r=0;r<g.length;r++){
    const lin=g[r]||[]; let tds='', vazio=true;
    for(let c=0;c<lin.length || c<CFG_FROTA_COL;c++){
      const e=L[r+','+c]||{}; if(e.x) continue;
      const cel=lin[c]; const t=_fmtFrota(cel); if(t!=='' || e.f) vazio=false;
      const st=[]; if(e.f) st.push('background:#'+e.f); if(e.b) st.push('font-weight:700'); if(e.c) st.push('color:#'+e.c);
      const txt = cel && typeof cel.v==='string' && !_ehErro(cel.v);
      tds+='<td'+(e.rs?' rowspan="'+e.rs+'"':'')+(e.cs?' colspan="'+e.cs+'"':'')+' class="'+(c===0?'lab':'')+(txt?' txt':'')+'" style="'+st.join(';')+'">'+_esc(t)+'</td>';
    }
    h += vazio && !tds.match(/rowspan/) ? '<tr class="gap"><td colspan="'+CFG_FROTA_COL+'"></td></tr>' : '<tr>'+tds+'</tr>';
  }
  return h;
}
const CFG_FROTA_COL = 12;
// ---- Filtro de ANO (multi-seleção). Padrão: ano corrente se existir na base; senão o último ano.
let ANOS_SEL = null;
function _garantirAnosSel(d){
  const disp=_anosDoDb(d);
  if(!disp.length){ ANOS_SEL=[]; return disp; }
  const ok=(ANOS_SEL||[]).filter(a=>disp.indexOf(a)>=0);
  if(ok.length){ ANOS_SEL=ok; return disp; }
  const at=String(new Date().getFullYear());
  ANOS_SEL=[ disp.indexOf(at)>=0 ? at : disp[disp.length-1] ];
  return disp;
}
function _renderFiltroAno(d){
  const disp=_garantirAnosSel(d), box=$('indFiltro');
  if(!disp.length){ box.style.display='none'; return; }
  box.style.display='';
  const ord=ANOS_SEL.slice().sort();
  $('anoBtn').textContent=(ord.length===disp.length && disp.length>1 ? 'Todos os anos' : ord.join(', '))+' ▾';
  $('anoMenu').innerHTML = disp.map(a=>'<label><input type="checkbox" value="'+a+'"'+(ANOS_SEL.indexOf(a)>=0?' checked':'')+' onchange="IND.anoMarcar(this)"> '+a+'</label>').join('')+
    '<div class="ms-rod"><a href="#" onclick="return IND.anoTodos()">Todos</a><a href="#" onclick="return IND.anoAtual()">Ano atual</a></div>';
}
function render(manterMenu){
  const sec = CFG.secoes.find(s=>s.id===SEC) || CFG.secoes[0];
  const d = sd(sec.id), tab=$('indTabela'), fonte=$('indFonte'), pills=$('indSecoes');
  if(CFG.secoes.length>1){
    pills.style.display='';
    pills.innerHTML = CFG.secoes.map(s=>'<button type="button" class="'+(s.id===sec.id?'on':'')+'" onclick="IND.secao(\''+s.id+'\')">'+_esc(s.titulo)+'</button>').join('');
  } else pills.style.display='none';
  if(sec.tipo==='frota'){
    $('indFiltro').style.display='none';
    if(!d.grade){ tab.innerHTML='<tbody><tr><td style="text-align:center;padding:20px;color:#9aa1af;background:#fff;">'+CFG.vazio+'</td></tr></tbody>'; fonte.style.display='none'; return; }
    tab.className='frota';
    tab.innerHTML='<tbody>'+_htmlFrota(d, LAYOUT[sec.id]||{})+'</tbody>';
  } else {
    tab.className='';
    if(!(d.linhas||[]).length){
      $('indFiltro').style.display='none';
      tab.innerHTML='<tbody><tr><td style="text-align:center;padding:20px;color:#9aa1af;background:#fff;">'+CFG.vazio+'</td></tr></tbody>'; fonte.style.display='none'; return;
    }
    _renderFiltroAno(d);
    if(manterMenu===true) $('anoMenu').classList.add('aberto');
    tab.innerHTML='<tbody>'+_montarHtmlTabela(d, LAYOUT[sec.id]||{}, AGG[sec.id]||{}, ANOS_SEL)+'</tbody>';
  }
  const quando = DB.atualizadoEm || d.atualizadoEm;
  if(quando){
    const dt=new Date(quando);
    fonte.textContent='Fonte: planilha INDICADORES - BANDEIRA e VIAÇÃO SETE (aba '+(d.aba||sec.aba||'')+') - atualizado em '+dt.toLocaleDateString('pt-BR')+' '+dt.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    fonte.style.display='';
  } else fonte.style.display='none';
}
// ---- leitura da planilha (roteamento por nome de aba)
function parseSecao(wb, sp){
  const nome = wb.SheetNames.find(n=> sp.abas.indexOf(_norm(n))>=0); if(!nome) return null;
  let g = _gradeDaAba(wb.Sheets[nome]);
  if(sp.c0 || sp.c1!=null) g = g.map(l=>l.slice(sp.c0||0, sp.c1!=null ? sp.c1+1 : undefined));
  if(sp.tipo==='frota'){ g = g.slice(0,sp.lin).map(l=>{ const x=l.slice(0,sp.col); while(x.length<sp.col) x.push(null); return x; }); return {tipo:'frota', grade:g, aba:nome}; }
  const r = parseGrade(g); if(!r.linhas.filter(l=>l.k).length) return null;
  r.aba = nome; return r;
}
function parseRota(wb, rota, prev){
  const out = {}; let achou=false;
  rota.secoes.forEach(sp=>{ const r=parseSecao(wb,sp); if(r){ out[sp.id]=r; achou=true; } });
  if(!achou) return null;
  if(!rota.multi) return out[rota.secoes[0].id];
  const m = Object.assign({}, prev && prev.secoes ? prev.secoes : {}, out);
  return { secoes: m };
}
function resumoDb(db){
  if(db.secoes) return Object.keys(db.secoes).length+' seção(ões)';
  if(db.grade) return 'matriz de frota';
  return db.linhas.filter(l=>l.k).length+' indicador(es), '+db.meses.length+' mês(es) de '+_rotMes(db.meses[0])+' a '+_rotMes(db.meses[db.meses.length-1]);
}
async function processar(files){
  const st=$('indStatus'); st.textContent='Processando...';
  for(const f of files){
    try{
      const wb = XLSX.read(await f.arrayBuffer(), {type:'array', cellNF:true});
      const feitos=[]; let proprio=false;
      for(const rota of CFG.rotas){
        const db = parseRota(wb, rota, rota.api===CFG.api ? DB : null); if(!db) continue;
        db.atualizadoEm = new Date().toISOString(); db.arquivo = f.name;
        if(rota.api===CFG.api){ DB=db; normalizar(); proprio=true; feitos.push(rota.nome+': '+resumoDb(db)); }
        else { const ok = await postNuvem(rota.api, db); feitos.push(rota.nome+(ok?' (enviado)':' (falha ao enviar)')); }
      }
      if(!feitos.length && wb.SheetNames.length===1 && !CFG.multi && CFG.secoes[0].tipo!=='frota'){
        const r=parseGrade(_gradeDaAba(wb.Sheets[wb.SheetNames[0]]));
        if(r.linhas.filter(l=>l.k).length){ r.aba=wb.SheetNames[0]; r.atualizadoEm=new Date().toISOString(); r.arquivo=f.name; DB=r; normalizar(); proprio=true; feitos.push(resumoDb(r)); }
      }
      st.textContent = feitos.length ? f.name+' - '+feitos.join(' | ') : 'Erro em '+f.name+': nenhuma aba reconhecida. Abas do arquivo: '+wb.SheetNames.join(', ')+'.';
      if(!proprio && feitos.length) st.textContent += ' | (esta planilha não trazia a aba deste setor)';
    }catch(e){ console.error(e); st.textContent='Erro ao processar '+f.name+': '+e.message; }
  }
  await saveDB(); render();
}
window.IND = {
  anoToggle: function(ev){ ev.stopPropagation(); $('anoMenu').classList.toggle('aberto'); },
  anoMarcar: function(cb){ const a=cb.value; if(cb.checked){ if(ANOS_SEL.indexOf(a)<0) ANOS_SEL.push(a); } else { if(ANOS_SEL.length<=1){ cb.checked=true; return; } ANOS_SEL=ANOS_SEL.filter(x=>x!==a); } render(true); },
  anoTodos: function(){ ANOS_SEL=_anosDoDb(sd(SEC)).slice(); render(true); return false; },
  anoAtual: function(){ ANOS_SEL=null; render(true); return false; },
  secao: function(id){ SEC=id; ANOS_SEL=null; render(); },
  abrir: function(){ $('indFile').click(); },
  csv: function(){
    const linhas=[]; document.querySelectorAll('#indTabela tr').forEach(tr=>{ const c=Array.from(tr.querySelectorAll('td')).map(x=>'"'+x.textContent.replace(/"/g,'""')+'"'); if(c.length) linhas.push(c.join(';')); });
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+linhas.join('\n')],{type:'text/csv;charset=utf-8;'})); a.download='Indicadores_'+CFG.api+'.csv'; a.click();
  },
  limpar: async function(){
    if(!confirm('Isso vai apagar toda a base local dos Indicadores ('+CFG.nomeCompleto+'). Essa ação não pode ser desfeita. Confirma?')) return;
    DB = {}; normalizar(); await saveDB(); render(); $('indStatus').textContent='Base local apagada.';
  }
};
document.addEventListener('click', e=>{ const m=$('anoMenu'); if(m && !e.target.closest('#anoMS')) m.classList.remove('aberto'); });
if(!PUBLICO){ const fi=$('indFile'); if(fi) fi.addEventListener('change', async ev=>{ const fs=Array.from(ev.target.files); if(fs.length) await processar(fs); ev.target.value=''; }); }
(async function(){ await loadDB(); render(); })();
})();
