  header.hub-top{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:flex-end; padding:16px 24px;
  }
  .btn-sair{
    background:var(--red); color:#fff; padding:9px 20px; border-radius:9px;
    text-decoration:none; font-weight:700; font-size:13px;
    box-shadow:0 1px 3px rgba(0,0,0,.25); transition:background .15s;
  }
  .btn-sair:hover{ background:var(--red-dark); }
  .logo{ height:76px; width:auto; display:block; border-radius:14px; margin-bottom:18px;
    box-shadow:0 4px 14px rgba(0,0,0,.35); }
  h1{
    color:#fff; font-size:30px; font-weight:800; text-align:center; margin:0 0 8px;
    letter-spacing:.3px;
  }
  .subtitulo{ color:#c7cee3; font-size:14px; text-align:center; margin:0 0 44px; }
  .areas{
    display:flex; flex-direction:row; gap:28px; flex-wrap:wrap; justify-content:center;
    max-width:920px;
  }
  a.area-card{
    background:#fff; border-radius:18px; width:230px; padding:28px 20px 24px;
    display:flex; flex-direction:column; align-items:center; gap:16px;
    text-decoration:none; box-shadow:0 6px 20px rgba(0,0,0,.25);
    border-top:5px solid var(--red); transition:transform .15s, box-shadow .15s;
  }
  a.area-card:hover{ transform:translateY(-4px); box-shadow:0 10px 28px rgba(0,0,0,.32); }
  a.area-card.indisponivel{ border-top-color:#9aa3b8; }
  .area-nome{ font-size:17px; font-weight:800; color:var(--navy); text-align:center; letter-spacing:.4px; }
  .area-icone{
    width:76px; height:76px; border-radius:16px; background:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  a.area-card.indisponivel .area-icone{ background:#5b6478; }
  .area-icone svg{ width:40px; height:40px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .area-tag{ font-size:11px; font-weight:700; color:#8890a0; letter-spacing:.5px; }
  .area-tag.ativo{ color:var(--red); }
  footer{ margin-top:48px; color:#8b93ad; font-size:12px; text-align:center; }
</style>
