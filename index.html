<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Bandeira Mobilidade &middot; Painel de Indicadores</title>
<style>
  /* Hub raiz do grupo -- criado em 2026-08-16 pra abrigar as empresas do Grupo Bandeira
     Mobilidade (GBM). A tela de setores que existia aqui antes (Comercial/Operacao/
     Manutencao/Financeiro da Viacao Sete) foi movida pra viacao-sete.html sem nenhuma
     alteracao de logica -- so o card "VIACAO SETE" abaixo aponta pra ela agora. */
  :root{
    --azul:#00579c; --azul-dark:#00304f; --azul-mid:#013f6b;
    --dourado:#efae25; --dourado-dark:#c98f11;
    --ink:#151b2b; --muted:#6b7280; --muted-soft:#9aa1af;
    --radius-sm:9px; --radius-md:14px; --radius-lg:18px;
    --shadow-md:0 6px 20px rgba(0,0,0,.25); --shadow-lg:0 10px 28px rgba(0,0,0,.32);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:var(--font);
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(239,174,37,.16) 0%, rgba(239,174,37,0) 60%),
      linear-gradient(160deg, var(--azul-mid) 0%, var(--azul-dark) 55%, #001b2e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  header.hub-top{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:flex-end; padding:16px 24px;
  }
  .btn-sair{
    background:var(--dourado); color:#151b2b; padding:9px 20px; border-radius:var(--radius-sm);
    text-decoration:none; font-weight:700; font-size:13px;
    box-shadow:0 1px 3px rgba(0,0,0,.25); transition:background .15s;
  }
  .btn-sair:hover{ background:var(--dourado-dark); }
  .logo-grupo{ height:92px; width:auto; display:block; margin-bottom:26px; }
  h1{
    color:#fff; font-size:22px; font-weight:700; text-align:center; margin:0 0 8px;
    letter-spacing:.3px; text-transform:uppercase;
  }
  .subtitulo{ color:#bcd2e6; font-size:14px; text-align:center; margin:0 0 44px; }
  .empresas{
    display:flex; flex-direction:row; gap:32px; flex-wrap:wrap; justify-content:center;
    max-width:640px;
  }
  a.empresa-card{
    background:#fff; border-radius:var(--radius-lg); width:260px; padding:34px 22px 28px;
    display:flex; flex-direction:column; align-items:center; gap:20px;
    text-decoration:none; box-shadow:var(--shadow-md);
    border-top:4px solid var(--azul); transition:transform .15s, box-shadow .15s;
  }
  a.empresa-card:hover{ transform:translateY(-4px); box-shadow:var(--shadow-lg); }
  a.empresa-card.indisponivel{ border-top-color:#9aa3b8; }
  .empresa-logo-box{
    height:64px; width:100%; display:flex; align-items:center; justify-content:center;
  }
  .empresa-logo-box img{ max-height:64px; max-width:100%; object-fit:contain; }
  .empresa-nome{ font-size:16.5px; font-weight:800; color:var(--ink); text-align:center; letter-spacing:.3px; }
  .empresa-tag{ font-size:11.5px; font-weight:700; color:var(--muted-soft); letter-spacing:.5px; }
  .empresa-tag.ativo{ color:var(--azul); }
  footer{ margin-top:48px; color:#8fa9bf; font-size:12px; text-align:center; }
</style>
</head>
<body>
<header class="hub-top">
  <a href="/__logout" class="btn-sair" title="Encerrar sessão">Sair</a>
</header>
