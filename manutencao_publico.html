<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Manutenção - Viação Sete</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ==================================================================================
   Mesmo sistema visual (tokens/CSS) do restante do projeto (financeiro.html, painel.html,
   operacao.html) -- copiado sem alterações pra manter os 4 setores idênticos visualmente.
   ================================================================================== */
:root{
  --navy:#132354; --navy-dark:#0c1938; --navy-soft:#eef1f8;
  --red:#b71930; --red-dark:#8f1226; --red-soft:#fdecee;
  --bg:#f5f6f9; --card:#ffffff; --border:#e5e8f0; --border-strong:#d6dae5;
  --ink:#151b2b; --muted:#6b7280; --muted-soft:#9aa1af;
  --green1:#eafbea; --green5:#1e7d34;
  --radius-sm:9px; --radius-md:12px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(16,24,54,.05); --shadow-md:0 3px 10px rgba(16,24,54,.07); --shadow-lg:0 10px 30px rgba(16,24,54,.16);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;}
header.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);box-shadow:var(--shadow-sm);}
header.top .logo{height:42px;width:auto;display:block;border-radius:8px;}
header.top .divider{width:1px;height:34px;background:var(--border);}
header.top .titulo-bloco{display:flex;flex-direction:column;gap:1px;}
header.top .titulo-bloco .eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;}
header.top h1{font-size:19px;color:var(--navy);margin:0;font-weight:800;line-height:1.2;letter-spacing:-.2px;}
header.top-publico{align-items:center;gap:16px;padding:12px 24px;background:var(--navy);box-shadow:var(--shadow-md);}
header.top-publico .logo{height:36px;width:auto;display:block;border-radius:8px;}
header.top-publico .divider{width:1px;height:30px;background:rgba(255,255,255,.2);}
header.top-publico h1{flex:1;font-size:15px;color:#fff;margin:0;font-weight:700;letter-spacing:-.1px;}
header.top-publico .btn-sair{background:var(--red);color:#fff;padding:8px 18px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;font-size:12.5px;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:background .15s;}
header.top-publico .btn-sair:hover{background:var(--red-dark);}
header.top-publico .btn-paineis{background:transparent;color:#fff;padding:8px 15px;border-radius:var(--radius-sm);text-decoration:none;font-weight:700;font-size:12.5px;border:1.5px solid rgba(255,255,255,.4);transition:background .15s,border-color .15s;}
header.top-publico .btn-paineis:hover{background:rgba(255,255,255,.1);border-color:#fff;}
.layout{display:flex;min-height:calc(100vh - 66px);}
nav.sidebar{width:148px;background:var(--bg);flex-shrink:0;padding:16px 10px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--border);}
nav.sidebar button{width:100%;background:transparent;border:none;border-left:3px solid transparent;color:var(--muted);padding:11px 8px;text-align:center;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;letter-spacing:.2px;border-radius:var(--radius-sm);transition:background .15s,color .15s;}
nav.sidebar button .ic{font-size:17px;}
nav.sidebar button.active{background:var(--navy);color:#fff;border-left-color:var(--red);box-shadow:var(--shadow-sm);}
nav.sidebar button:hover:not(.active){background:var(--navy-soft);color:var(--navy);}
main{flex:1;min-width:0;padding:18px 22px 130px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:18px;box-shadow:var(--shadow-sm);}
.panel h2{margin:0 0 14px;font-size:13.5px;font-weight:700;color:var(--ink);border-bottom:1px solid var(--border);padding-bottom:10px;padding-left:11px;position:relative;letter-spacing:.1px;}
.panel h2::before{content:'';position:absolute;left:0;top:1px;bottom:11px;width:3px;border-radius:2px;background:var(--navy);}
/* Título de painel com botões de ação ao lado (ex.: Lançamentos > Exportar CSV/PDF) --
   pedido do usuário em 2026-08-15. O h2 perde a própria borda/espaçamento (passam pro
   wrapper) pra não duplicar a linha; o ::before (barrinha navy) continua igual. */
.panel-titulo-flex{display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:14px;flex-wrap:wrap;}
.panel-titulo-flex h2{border-bottom:none;padding-bottom:0;margin-bottom:0;flex:1;min-width:200px;}
.panel-titulo-flex .btn-relatorio-group{display:flex;gap:8px;flex-shrink:0;}
/* Mesmo padrão de cor já usado nos botões de exportação dos popups da DRE/Indicadores
   (.modal-actions button / .pdf): navy pro CSV, vermelho pro PDF -- pedido do usuário
   em 2026-08-15 pra estes botões pararem de ficar "brancos" (fora do padrão). */
.btn-relatorio{background:var(--navy);color:#fff;border:none;padding:8px 16px;border-radius:var(--radius-sm);font-size:11.5px;font-weight:700;cursor:pointer;transition:background .15s;white-space:nowrap;}
.btn-relatorio:hover{background:var(--navy-dark);}
.btn-relatorio.pdf{background:var(--red);}
.btn-relatorio.pdf:hover{background:var(--red-dark);}
.filters-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px 16px;}
.filters-grid > div > label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase;}
.filters-grid select,.filters-grid input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12.5px;color:var(--ink);background:#fff;transition:border-color .15s;}
.filters-grid select:focus,.filters-grid input:focus{outline:none;border-color:var(--navy);}
.filtro-toggle{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px;}
.filtro-toggle .seta{display:inline-block;transition:transform .15s;font-size:11px;}
.filtro-box.collapsed .filtro-toggle .seta{transform:rotate(-90deg);}
.filtro-box.collapsed .filters-grid{display:none;}
/* Componente MSF (multi-seleção com busca + Todos/Limpar) -- mesmo componente já usado
   no Comercial/Financeiro (construirMSF/filtroPassa), copiado sem alterações. Pedido do
   usuário em 2026-08-15: os filtros de Posto/Carro/Tipo de Combustível passam a aceitar
   mais de uma seleção, igual aos demais painéis. */
.msf{position:relative;}
.msf-btn{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12.5px;color:var(--ink);background:#fff;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;transition:border-color .15s;}
.msf-btn:hover{border-color:var(--navy);}
.msf-btn .car{font-size:9px;color:var(--muted);}
.msf-btn .msf-btn-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msf-panel{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:80;padding:10px;display:none;min-width:100%;width:max-content;max-width:min(480px,90vw);}
.msf.open .msf-panel{display:block;}
.msf-actions{display:flex;gap:8px;margin-bottom:8px;}
.msf-actions button{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--navy);font-size:11.5px;font-weight:700;padding:7px 6px;border-radius:var(--radius-sm);cursor:pointer;text-align:center;transition:background .15s;}
.msf-actions button:hover{background:var(--navy-soft);}
.msf-actions button.msf-clear{color:var(--red);}
.msf-search{width:100%;padding:7px 9px;border:1px solid var(--border-strong);border-radius:8px;font-size:12px;margin-bottom:6px;box-sizing:border-box;}
.msf-list{max-height:200px;overflow:auto;display:flex;flex-direction:column;gap:1px;}
.msf-list label{display:flex !important;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;font-size:12px;font-weight:normal;letter-spacing:normal;margin:0;padding:4px 5px;border-radius:6px;cursor:pointer;color:#20293b;text-align:left;width:100%;box-sizing:border-box;white-space:nowrap;}
.msf-list label span,.msf-list label input{text-align:left;}
.msf-list label:hover{background:#f2f4f9;}
.msf-list input[type=checkbox]{cursor:pointer;width:auto !important;flex:0 0 auto;margin:0;}
.msf-empty{font-size:11px;color:var(--muted);padding:4px;}
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;text-align:center;box-shadow:var(--shadow-sm);transition:box-shadow .15s;}
.kpi:hover{box-shadow:var(--shadow-md);}
.kpi .lbl{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;margin-bottom:7px;text-align:center;text-transform:uppercase;}
.kpi .val{font-size:21px;font-weight:800;color:var(--ink);text-align:center;letter-spacing:-.3px;}
.kpi .sub{font-size:11px;color:var(--muted);margin-top:5px;text-align:center;}
.kpi-destaque{background:var(--navy);border-color:var(--navy-dark);box-shadow:var(--shadow-md);}
.kpi-destaque .lbl{color:#aab6db;}
.kpi-destaque .val{color:#fff;}
.kpi-destaque .sub{color:#aab6db;}
table.data{width:100%;border-collapse:separate;border-spacing:0;font-size:12px;border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow-sm);}
table.data th{background:var(--navy);color:#fff;padding:9px 10px;text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.3px;cursor:pointer;position:sticky;top:0;z-index:2;}
table.data th .seta-ord{font-size:9px;opacity:.7;margin-left:3px;}
table.data td{padding:8px 10px;border-bottom:1px solid var(--border);}
table.data tr:nth-child(even) td{background:#fafbfc;}
table.data tr.total-row td{background:var(--navy);color:#fff;font-weight:700;border-top:2px solid var(--red);}
table.data td.cel-centro,table.data th.cel-centro{text-align:center;}
table.data td.cel-num,table.data th.cel-num{text-align:right;font-variant-numeric:tabular-nums;}
.scroll-box{max-height:60vh;overflow:auto;border-radius:var(--radius-md);}
/* Linha de TOTAL (Litros/Preço Médio/Valor Total) da tabela de Lançamentos: tabela
   SEPARADA (#cbTabelaTotal), fora da .scroll-box -- mesma técnica já usada em Venda
   Futura > TOTAL RECEBÍVEIS (financeiro.html). position:sticky não funciona de forma
   confiável dentro de uma .scroll-box cujo conteúdo às vezes não enche a área (poucos
   lançamentos no filtro) -- por isso a linha de total fica numa tabela própria, sempre
   visível em fluxo normal logo abaixo da .scroll-box, nunca depende de sticky.
   table-layout:fixed + <colgroup> idênticos em #cbTabela e #cbTabelaTotal garantem que
   as colunas das duas tabelas fiquem alinhadas (cada <table> teria largura de coluna
   diferente se dependesse só do próprio conteúdo). */
#cbTabela,#cbTabelaTotal{table-layout:fixed;}
#cbTabelaTotal{margin-top:-1px;}
#cbTabelaTotal tr td{border-top-left-radius:0;border-top-right-radius:0;}
/* Cabeçalho congelado (position:sticky) dentro da .scroll-box -- pedido do usuário em
   2026-08-15. "overflow:hidden" em table.data (usado pra arredondar os cantos da
   tabela) impede o sticky do th de funcionar, porque fica entre o th e a .scroll-box
   (o ancestral que realmente rola) -- mesma causa raiz já documentada e corrigida em
   várias tabelas do painel Financeiro (#vfTabela, #bcTabelaConvenios, etc.). Aqui só
   #cbTabela vira overflow:visible; os cantos arredondados são recriados na mão nas
   células de ponta (1ª/última coluna do cabeçalho e da última linha do corpo). */
#cbTabela{overflow:visible;}
#cbTabela tr:first-child th:first-child{border-top-left-radius:12px;}
#cbTabela tr:first-child th:last-child{border-top-right-radius:12px;}
#cbTabela tbody tr:last-child td:first-child{border-bottom-left-radius:12px;}
#cbTabela tbody tr:last-child td:last-child{border-bottom-right-radius:12px;}
.btn-acao{background:none;border:1px solid var(--border-strong);color:var(--navy);padding:4px 9px;border-radius:7px;font-size:10.5px;font-weight:700;cursor:pointer;margin-right:4px;transition:background .15s;}
.btn-acao:hover{background:var(--navy-soft);}
.btn-acao.excluir{color:var(--red);border-color:var(--red-soft);}
.btn-acao.excluir:hover{background:var(--red-soft);}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px 16px;align-items:end;}
.form-grid > div > label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:5px;letter-spacing:.4px;text-transform:uppercase;}
.form-grid select,.form-grid input{width:100%;padding:8px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:12.5px;color:var(--ink);background:#fff;transition:border-color .15s;}
.form-grid select:focus,.form-grid input:focus{outline:none;border-color:var(--navy);}
.form-grid .valor-total-display{padding:8px 10px;background:var(--navy-soft);border-radius:var(--radius-sm);font-weight:800;color:var(--navy);font-size:13px;text-align:right;}
.form-actions{display:flex;gap:10px;margin-top:14px;}
.form-actions button{background:var(--navy);color:#fff;border:none;padding:9px 20px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:700;cursor:pointer;transition:background .15s;}
.form-actions button:hover{background:var(--navy-dark);}
.form-actions button.cancelar{background:#fff;color:var(--muted);border:1px solid var(--border-strong);}
.form-actions button.cancelar:hover{background:var(--bg);}
.info-badge{font-size:10px;background:#fff3cd;color:#7a5b00;padding:3px 9px;border-radius:var(--radius-sm);margin-left:8px;font-weight:600;}
#uploadBar{position:sticky;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--border);box-shadow:0 -2px 8px rgba(16,24,54,.06);padding:10px 22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;}
#uploadBar .status{color:var(--muted);}
#uploadBar button{background:var(--red);color:#fff;border:none;padding:9px 16px;border-radius:var(--radius-sm);cursor:pointer;font-weight:700;font-size:12px;transition:background .15s;}
#uploadBar button:hover{background:var(--red-dark);}
#uploadBar button.secondary{background:#fff;color:var(--navy);border:1px solid var(--border-strong);}
#uploadBar button.secondary:hover{background:var(--navy-soft);border-color:var(--navy);}
.hidden{display:none !important;}
</style></head>

<div class="layout">
  <!-- Setor criado em 2026-08-14. Só 1 aba por enquanto (Combustível); novas abas de
       Manutenção entram aqui do mesmo jeito que Bancos/DRE entraram no Financeiro. -->
  <nav class="sidebar" id="sidebar">
    <button data-tab="combustivel" class="active"><span class="ic">&#9981;</span>Combustível</button>
  </nav>
  <main>
    <!-- ABA CONTROLE DE COMBUSTÍVEL -- "planilha viva": diferente de todo o resto do
         projeto (que é alimentado por upload de relatório), aqui o motorista/gestor
         digita o abastecimento diretamente na tela (CRUD manual), sem nenhum arquivo
         de origem. Pedido dos sócios em 2026-08-14. Só o painel público (EMBEDDED_DB)
         fica "congelado"; este arquivo local é onde os dados são de fato editados. -->
    <section class="tab" id="tab-combustivel">
      <div class="panel filtro-box" id="filtrosPanelComb">
        <h2 class="filtro-toggle" onclick="toggleFiltroBox(this)"><span class="seta">&#9660;</span> Filtros</h2>
        <div class="filters-grid">
          <div><label>DATA INÍCIO</label><input type="date" id="cbDataIni" onchange="renderCombustivel()"></div>
          <div><label>DATA FIM</label><input type="date" id="cbDataFim" onchange="renderCombustivel()"></div>
          <div><label>POSTO</label><div class="msf" id="cbFiltroPosto"></div></div>
          <div><label>CARRO</label><div class="msf" id="cbFiltroCarro"></div></div>
          <div><label>TIPO DE COMBUSTÍVEL</label><div class="msf" id="cbFiltroTipo"></div></div>
        </div>
      </div>

      <div class="kpi-row" id="cbKpiRow"></div>

      <!-- Formulário de lançamento -- serve tanto pra ADICIONAR quanto pra EDITAR
           (id="cbEditandoId" guarda o registro em edição; vazio = modo "novo"). -->
      <div class="panel" id="painelFormCombustivel">
        <h2 id="cbFormTitulo">Novo Abastecimento</h2>
        <div class="form-grid">
          <div><label>Data do Abastecimento</label><input type="date" id="cbData"></div>
          <div><label>Posto</label>
            <select id="cbPosto" onchange="_cbAoTrocarPosto()"></select>
          </div>
          <div><label>Nº do Carro</label>
            <select id="cbCarro"></select>
          </div>
          <div><label>Tipo de Combustível</label>
            <select id="cbTipo" onchange="_cbAoTrocarTipo()"></select>
          </div>
          <div><label>Litros</label><input type="number" id="cbLitros" step="0.01" min="0" placeholder="0,00" oninput="_cbAtualizarValorTotal()"></div>
          <div><label>Preço do Litro (R$)</label><input type="number" id="cbPreco" step="0.001" min="0" placeholder="0,00" oninput="_cbAtualizarValorTotal()"></div>
          <div><label>Valor Total</label><div class="valor-total-display" id="cbValorTotalDisplay">R$ 0,00</div></div>
        </div>
        <div class="form-actions">
          <button onclick="cbSalvarRegistro()" id="cbBtnSalvar">+ Adicionar</button>
          <button class="cancelar hidden" id="cbBtnCancelar" onclick="cbCancelarEdicao()">Cancelar edição</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-titulo-flex">
          <h2>Lançamentos <span class="info-badge">clique numa coluna pra ordenar</span></h2>
          <div class="btn-relatorio-group">
            <button class="btn-relatorio" onclick="cbExportarCSV()">Exportar CSV</button>
            <button class="btn-relatorio pdf" onclick="cbExportarPDF()">Exportar PDF</button>
          </div>
        </div>
        <!-- colgroup idêntico em #cbTabela e #cbTabelaTotal (ver comentário no CSS) --
             garante que a linha de TOTAL abaixo fique com as colunas alinhadas com a
             tabela de cima, mesmo sendo duas <table> separadas. -->
        <div class="scroll-box">
          <table class="data" id="cbTabela">
            <colgroup><col style="width:9%"><col style="width:26%"><col style="width:15%"><col style="width:12%"><col style="width:9%"><col style="width:9%"><col style="width:11%"><col style="width:9%"></colgroup>
            <thead></thead><tbody></tbody>
          </table>
        </div>
        <table class="data" id="cbTabelaTotal">
          <colgroup><col style="width:9%"><col style="width:26%"><col style="width:15%"><col style="width:12%"><col style="width:9%"><col style="width:9%"><col style="width:11%"><col style="width:9%"></colgroup>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- Barra de rodapé -- sem "Carregar arquivos" (não existe upload de relatório nesta
     aba); em vez disso, um botão pra importar em lote os lançamentos que eu (Claude)
     extraio manualmente das fotos de comprovante que os motoristas postam no WhatsApp
     da empresa (ver conversa) -- gera um .xlsx padrão (DATA / POSTO / PREFIXO / LITROS /
     PRECO_LITRO) que o botão abaixo lê e soma na base local, sem precisar redigitar
     cada lançamento na mão. -->
<div id="uploadBar">
  <span id="uploadControlesEdicao">
    <button onclick="document.getElementById('fileInputFotos').click()">Importar lançamentos (fotos)</button>
    <input type="file" id="fileInputFotos" accept=".xls,.xlsx" style="display:none">
    <button class="secondary" onclick="limparBase()">Limpar base local</button>
    <button class="secondary" onclick="exportarBaseCompleta()">Exportar base (para link público)</button>
  </span>
  <span class="status" id="uploadStatus">Carregando base local...</span>
</div>

// ==================================================================================

async function _sincronizarNuvem(){
  if(MODO_PUBLICO) return;

let DB = { combustivel: [] };

const IDB_NOME = 'viacaosete_manutencao_idb';
const IDB_STORE = 'kv';
const IDB_CHAVE = 'viacaosete_manutencao_v1';

function _idbAbrir(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(IDB_NOME, 1);
    req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function _idbGet(conn, chave){
  return new Promise((resolve, reject)=>{
    const tx = conn.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(chave);
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function _idbPut(conn, chave, valor){
  return new Promise((resolve, reject)=>{
    const tx = conn.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(valor, chave);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function loadDB(){

    // painel Comercial ("Painel Viação Sete.html"). Tenta buscar a base ao vivo do
    // backend na nuvem; se falhar, continua mostrando o EMBEDDED_DB normalmente.
    try{
      const resp = await fetch(API_BASE + '/api/dados?setor=manutencao', {cache:'no-store'});
      if(resp.ok){
        const dadosNuvem = await resp.json();
        if(dadosNuvem){ DB = dadosNuvem; DB.combustivel = DB.combustivel || []; _migrarTipoCombustivel(); _migrarValorTotalCombustivel(); }
      }
    }catch(e){ console.warn('Não foi possível buscar dados ao vivo, mostrando o último publicado:', e); }
    return;
  }
  try{
    const conn = await _idbAbrir();
    const raw = await _idbGet(conn, IDB_CHAVE);
    if(raw) DB = raw;
  }catch(e){ console.error('Erro ao carregar base local (Manutenção)', e); }
  DB.combustivel = DB.combustivel || [];

// Migração automática (pedido do usuário, 2026-08-15): o campo "tipo" (Diesel/Arla 32)
// não existia antes desta data -- todo lançamento já feito é Óleo Diesel de verdade
// (foi o único tipo lançado até aqui, e os preços fixos de POSTOS_LISTA são de
// Diesel). Roda a cada load, então cobre tanto a base local quanto qualquer JSON
// antigo reimportado. Retorna true se alguma migração foi aplicada (pra saber se
// vale a pena persistir de novo).
function _migrarTipoCombustivel(){
  let mudou = false;
  (DB.combustivel||[]).forEach(r=>{
    if(!r.tipo){ r.tipo = 'DIESEL'; mudou = true; }
  });
  return mudou;
}
// Migração automática (pedido do usuário, 2026-08-16): Valor Total deve ser truncado
// pra 2 casas, nunca arredondado (384,496 L x 6,65 = 2.556,8984 -> 2.556,89, nao
// 2.556,90). Lançamentos salvos antes dessa correção usavam Math.round e podem ter
// 1 centavo a mais. Recalcula litros x preco com truncamento pra todo registro, toda
// vez que carrega -- cobre a base local, qualquer JSON antigo reimportado e o
// EMBEDDED_DB/dado ao vivo do público. Retorna true se algum valor mudou.
function _migrarValorTotalCombustivel(){
  let mudou = false;
  (DB.combustivel||[]).forEach(r=>{
    const correto = _truncar2Casas(r.litros * r.preco);
    if(Math.abs((r.valorTotal||0) - correto) > 1e-9){ r.valorTotal = correto; mudou = true; }
  });
  return mudou;
}

function _fmtBRL(v){
  return (v||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function _fmtNum(v, casas){
  return (v||0).toLocaleString('pt-BR', {minimumFractionDigits:casas, maximumFractionDigits:casas});
}
// Trunca (nao arredonda) pra 2 casas decimais -- pedido do usuario em 2026-08-16 pro
// Valor Total do Controle de Combustivel: 384,496 L x 6,65 = 2.556,8984, deve mostrar
// 2.556,89 (as duas primeiras casas que derem), nunca 2.556,90. O epsilon pequeno
// (1e-9) so corrige ruido de ponto flutuante (ex: 10 as vezes vira 9.999999999998
// internamente), nao muda o comportamento de truncar de verdade.
function _truncar2Casas(v){
  return Math.floor((v||0) * 100 + 1e-9) / 100;
}
function formatarDataBR(iso){
  if(!iso) return '';
  const [y,m,d] = String(iso).split('-');
  return d+'/'+m+'/'+y;
}
// Data local (não UTC) no formato AAAA-MM-DD, pra preencher o campo Data do Novo
// Abastecimento com "hoje" por padrão (pedido do usuário, 2026-08-15).
function _hojeISO(){
  const d = new Date();
  const offsetMs = d.getTimezoneOffset()*60000;
  return new Date(d.getTime()-offsetMs).toISOString().slice(0,10);
}
// Reancora o filtro DATA INÍCIO/DATA FIM pra sempre mostrar o mês do lançamento mais
// recente por padrão -- INÍCIO = primeira data que TEM lançamento naquele mês, FIM =
// última data que tem lançamento (não é necessariamente dia 01/dia 30 do calendário,
// é o que realmente foi lançado). Pedido do usuário em 2026-08-15. Chamada ao carregar
// a página e sempre que a base muda (adicionar/editar/excluir/importar por foto) --
// se o usuário quiser ver outro mês, basta trocar os campos manualmente depois.
function _resetarFiltroCombustivelParaUltimoMes(){
  const datas = (DB.combustivel||[]).map(r=>r.data).filter(Boolean).sort();
  if(!datas.length) return;
  const ultimaData = datas[datas.length-1];
  const mes = ultimaData.slice(0,7); // AAAA-MM
  const datasDoMes = datas.filter(d=>d.startsWith(mes));
  document.getElementById('cbDataIni').value = datasDoMes[0];
  document.getElementById('cbDataFim').value = datasDoMes[datasDoMes.length-1];
}

const filtroEstado = {}; // id -> Set de valores selecionados (vazio = "Todos")
function filtroPassa(id, valor){

  if(!s || s.size===0) return true;

function construirMSF(id, valores, labelFn){
  labelFn = labelFn || (v=>v);
  const wrap = document.getElementById(id);
  if(!wrap) return;
  const atual = filtroEstado[id] || new Set();
  filtroEstado[id] = new Set([...atual].filter(v=>valores.includes(v)));

  wrap.classList.add('msf');
  wrap.innerHTML =
    '<button type="button" class="msf-btn"><span class="msf-btn-label"></span><span class="car">&#9660;</span></button>'+
    '<div class="msf-panel">'+
      '<div class="msf-actions">'+
        '<button type="button" class="msf-todos">Todos</button>'+
        '<button type="button" class="msf-clear">Limpar</button>'+
      '</div>'+
      '<input type="text" class="msf-search" placeholder="Buscar...">'+
      '<div class="msf-list"></div>'+
    '</div>';

  const btn = wrap.querySelector('.msf-btn');
  const btnLabel = wrap.querySelector('.msf-btn-label');
  const search = wrap.querySelector('.msf-search');
  const lista = wrap.querySelector('.msf-list');
  const todosBtn = wrap.querySelector('.msf-todos');
  const clearBtn = wrap.querySelector('.msf-clear');

  function atualizarBotao(){
    const sel = filtroEstado[id];
    const n = sel.size;
    btnLabel.textContent = n===0 ? 'Todos' : (n===1 ? labelFn([...sel][0]) : n+' selecionados');
  }
  function valoresVisiveis(){
    const termo = (search.value||'').trim().toLowerCase();
    return valores.filter(v=>!termo || labelFn(v).toLowerCase().includes(termo));
  }
  function renderLista(){
    lista.innerHTML='';
    const filtrados = valoresVisiveis();
    if(!filtrados.length){ lista.innerHTML = '<div class="msf-empty">Nenhum resultado.</div>'; return; }
    filtrados.forEach(v=>{
      const lab = document.createElement('label');
      const chk = document.createElement('input'); chk.type='checkbox'; chk.checked = filtroEstado[id].has(v);
      chk.addEventListener('change', ()=>{
        if(chk.checked) filtroEstado[id].add(v); else filtroEstado[id].delete(v);
        atualizarBotao();
        _dispararMudancaFiltro(id);
      });
      lab.appendChild(chk);
      lab.appendChild(document.createTextNode(labelFn(v)));
      lista.appendChild(lab);
    });
  }
  btn.addEventListener('click', e=>{
    e.stopPropagation();
    const estavaAberto = wrap.classList.contains('open');
    document.querySelectorAll('.msf.open').forEach(el=>el.classList.remove('open'));
    if(!estavaAberto){ wrap.classList.add('open'); search.value=''; renderLista(); search.focus(); }
  });
  search.addEventListener('input', renderLista);
  search.addEventListener('click', e=>e.stopPropagation());
  todosBtn.addEventListener('click', e=>{
    e.stopPropagation();
    valoresVisiveis().forEach(v=>filtroEstado[id].add(v));
    renderLista();
    atualizarBotao();
    _dispararMudancaFiltro(id);
  });
  clearBtn.addEventListener('click', e=>{
    e.stopPropagation();
    filtroEstado[id].clear();
    renderLista();
    atualizarBotao();
    _dispararMudancaFiltro(id);
  });
  wrap.querySelector('.msf-panel').addEventListener('click', e=>e.stopPropagation());

  atualizarBotao();
}

  if(!reg) return;
  if(!confirm('Excluir o abastecimento de '+formatarDataBR(reg.data)+' ('+reg.prefixo+', '+_fmtNum(reg.litros,2)+' L)? Essa ação não pode ser desfeita.')) return;
  DB.combustivel = DB.combustivel.filter(r=>r.id!==id);
  saveDB();
  if(cbEditandoId===id) cbCancelarEdicao();
  _resetarFiltroCombustivelParaUltimoMes();
  renderCombustivel();
}

let cbOrdemCampo = 'data', cbOrdemAsc = false; // mais recente primeiro por padrão
function cbOrdenar(campo){
  if(cbOrdemCampo===campo) cbOrdemAsc = !cbOrdemAsc; else { cbOrdemCampo = campo; cbOrdemAsc = true; }
  renderCombustivel();
}

// Relatório de Lançamentos em CSV/PDF -- pedido do usuário em 2026-08-15, mesmo
// mecanismo já usado em Indicadores (painel Comercial) e nos popups da DRE (Financeiro):
// CSV com BOM (abre certo no Excel BR) e PDF via janela nova + window.print(). Reflete
// exatamente o que está na tela (mesmo filtro Data/Posto/Carro e mesma ordenação
// clicada nas colunas), sem a coluna Ações (Editar/Excluir não fazem sentido num
// relatório impresso/exportado). Inclui uma linha de TOTAL (Litros e Valor Total).
function _cbLinhasRelatorio(){
  const lista = _combustivelFiltrado();
  const ordenada = [...lista].sort((a,b)=>{
    let va=a[cbOrdemCampo], vb=b[cbOrdemCampo];
    if(typeof va==='string') va=va.toLowerCase();
    if(typeof vb==='string') vb=vb.toLowerCase();
    if(va<vb) return cbOrdemAsc?-1:1;
    if(va>vb) return cbOrdemAsc?1:-1;
    return 0;
  });
  const header = ['Data','Posto','Carro','Tipo','Litros','Preço/Litro','Valor Total'];
  const linhas = ordenada.map(r=>[
    formatarDataBR(r.data), r.posto, r.prefixo+' — '+(r.placa||''), _cbNomeTipo(r.tipo),
    _fmtNum(r.litros,2)+' L', _fmtBRL(r.preco), _fmtBRL(r.valorTotal)
  ]);
  const totalLitros = ordenada.reduce((s,r)=>s+r.litros,0);
  const totalValor = ordenada.reduce((s,r)=>s+r.valorTotal,0);
  const totalRow = ['TOTAL','','','', _fmtNum(totalLitros,2)+' L', '', _fmtBRL(totalValor)];
  return { header, linhas, totalRow };
}
function _cbPeriodoArquivo(){
  const di = document.getElementById('cbDataIni').value;
  const df = document.getElementById('cbDataFim').value;
  if(di && df) return di.replace(/-/g,'')+'_a_'+df.replace(/-/g,'');
  return 'todos';
}
function cbExportarCSV(){
  const {header, linhas, totalRow} = _cbLinhasRelatorio();
  const todasLinhas = [header, ...linhas, totalRow];
  const csv = todasLinhas.map(cols=>cols.join(';')).join('\n');
  const blob = new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'lancamentos_combustivel_'+_cbPeriodoArquivo()+'.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
function cbExportarPDF(){
  const {header, linhas, totalRow} = _cbLinhasRelatorio();
  const win = window.open('', '_blank');
  if(!win) return;
  const linhasHtml = linhas.map(l=>'<tr>'+l.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('');
  const totalHtml = '<tr class="total">'+totalRow.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
  win.document.write('<html><head><meta charset="UTF-8"><title>Lançamentos de Combustível</title><style>'+
    '@page{size:landscape;margin:12mm;}'+
    'body{font-family:Arial,sans-serif;padding:0;color:#1b2432;}'+
    'h2{color:#132354;margin:0 0 12px;font-size:16px;}'+
    'table{border-collapse:collapse;width:100%;font-size:11px;}'+
    'th,td{padding:6px 8px;border-bottom:1px solid #e2e6ee;text-align:left;}'+
    'th{background:#132354;color:#fff;}'+
    'tr.total td{background:#eef2fb;font-weight:800;color:#132354;border-top:2px solid #b71930;}'+
    '</style></head><body>'+
    '<h2>Lançamentos de Combustível</h2>'+
    '<table><thead><tr>'+header.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+linhasHtml+totalHtml+'</tbody></table>'+
    '</body></html>');
  win.document.close();
  win.focus();
  setTimeout(()=>win.print(), 400);
}

function _combustivelFiltrado(){
  const di = document.getElementById('cbDataIni').value;
  const df = document.getElementById('cbDataFim').value;
  return (DB.combustivel||[]).filter(r=>{
    if(di && r.data < di) return false;
    if(df && r.data > df) return false;
    if(!filtroPassa('cbFiltroPosto', r.posto)) return false;
    if(!filtroPassa('cbFiltroCarro', r.prefixo)) return false;
    if(!filtroPassa('cbFiltroTipo', r.tipo)) return false;
    return true;
  });
}
// Nome de exibição do tipo (DIESEL -> "Óleo Diesel"); cai no próprio código se, por
// algum motivo, vier um valor fora da lista (nunca deveria acontecer, mas evita
// mostrar "undefined" na tabela/relatório).
function _cbNomeTipo(codigo){
  const t = TIPOS_COMBUSTIVEL.find(t=>t.codigo===codigo);
  return t ? t.nome : (codigo||'');
}

function renderCombustivel(){
  const lista = _combustivelFiltrado();

  // KPIs
  const totalGasto = lista.reduce((s,r)=>s+r.valorTotal,0);
  const totalLitros = lista.reduce((s,r)=>s+r.litros,0);
  const precoMedio = totalLitros>0 ? totalGasto/totalLitros : 0;
  document.getElementById('cbKpiRow').innerHTML = `
    <div class="kpi kpi-destaque"><div class="lbl">Total Gasto</div><div class="val">${_fmtBRL(totalGasto)}</div></div>
    <div class="kpi"><div class="lbl">Total de Litros</div><div class="val">${_fmtNum(totalLitros,2)} L</div></div>
    <div class="kpi"><div class="lbl">Preço Médio / Litro</div><div class="val">${_fmtBRL(precoMedio)}</div></div>
    <div class="kpi"><div class="lbl">Abastecimentos</div><div class="val">${lista.length}</div></div>
  `;

  // Tabela -- cabeçalho alinhado com a mesma classe da coluna de dados (Litros/Preço/
  // Valor Total à direita, Ações centralizado), pedido do usuário em 2026-08-15.
  const campos = {data:'Data', posto:'Posto', prefixo:'Carro', tipo:'Tipo', litros:'Litros', preco:'Preço/Litro', valorTotal:'Valor Total'};
  const camposNum = new Set(['litros','preco','valorTotal']);
  const th = Object.keys(campos).map(c=>{
    const seta = cbOrdemCampo===c ? (cbOrdemAsc?'&#9650;':'&#9660;') : '';
    const cls = camposNum.has(c) ? ' class="cel-num"' : '';
    return `<th${cls} onclick="cbOrdenar('${c}')">${campos[c]}<span class="seta-ord">${seta}</span></th>`;
  }).join('') + (MODO_PUBLICO ? '' : '<th class="cel-centro">Ações</th>');
  document.getElementById('cbTabela').querySelector('thead').innerHTML = '<tr>'+th+'</tr>';

  const ordenada = [...lista].sort((a,b)=>{
    let va=a[cbOrdemCampo], vb=b[cbOrdemCampo];
    if(typeof va==='string') va=va.toLowerCase();
    if(typeof vb==='string') vb=vb.toLowerCase();
    if(va<vb) return cbOrdemAsc?-1:1;
    if(va>vb) return cbOrdemAsc?1:-1;
    return 0;
  });
  const tbody = document.getElementById('cbTabela').querySelector('tbody');
  if(!ordenada.length){
    tbody.innerHTML = '<tr><td colspan="'+(MODO_PUBLICO?7:8)+'" style="text-align:center;color:var(--muted);padding:18px;">Nenhum lançamento no período/filtro selecionado.</td></tr>';
  } else {
    tbody.innerHTML = ordenada.map(r=>`
      <tr>
        <td>${formatarDataBR(r.data)}</td>
        <td>${r.posto}</td>
        <td>${r.prefixo} — ${r.placa||''}</td>
        <td>${_cbNomeTipo(r.tipo)}</td>
        <td class="cel-num">${_fmtNum(r.litros,2)} L</td>
        <td class="cel-num">${_fmtBRL(r.preco)}</td>
        <td class="cel-num">${_fmtBRL(r.valorTotal)}</td>
        ${MODO_PUBLICO ? '' : `<td class="cel-centro">
          <button class="btn-acao" onclick="cbEditar('${r.id}')">Editar</button>
          <button class="btn-acao excluir" onclick="cbExcluir('${r.id}')">Excluir</button>
        </td>`}
      </tr>
    `).join('');
  }

  // Linha de TOTAL (Litros/Preço Médio/Valor Total), tabela separada e sempre visível
  // fora da .scroll-box -- ver comentário no CSS (#cbTabelaTotal). Preço Médio usa a
  // MESMA fórmula do KPI "Preço Médio / Litro" acima (Valor Total / Quantidade de
  // Litros), pedido explícito do usuário em 2026-08-15.
  const tabelaTotal = document.getElementById('cbTabelaTotal');
  if(tabelaTotal){
    tabelaTotal.querySelector('tbody').innerHTML = `
      <tr class="total-row">
        <td>TOTAL</td>
        <td></td>
        <td></td>
        <td></td>
        <td class="cel-num">${_fmtNum(totalLitros,2)} L</td>
        <td class="cel-num">${_fmtBRL(precoMedio)}</td>
        <td class="cel-num">${_fmtBRL(totalGasto)}</td>
        ${MODO_PUBLICO ? '' : '<td></td>'}
      </tr>
    `;
  }
}

// ==================================================================================
// IMPORTAR LANÇAMENTOS POR FOTO -- fluxo combinado com o usuário em 2026-08-15: não
// existe conector de WhatsApp nem OCR automático embutido no painel, então o processo
// é: o usuário manda as fotos dos comprovantes numa conversa comigo (Claude), eu leio
// cada uma e gero um .xlsx com as colunas abaixo (mesmo padrão de import dos outros
// setores) -- esse botão só lê esse arquivo já pronto e soma na base local, sem precisar
// redigitar cada lançamento na mão. Colunas esperadas (linha 1 = cabeçalho):
// DATA (dd/mm/aaaa ou serial Excel) | POSTO (nome igual à lista POSTOS_LISTA) |
// PREFIXO (nº do carro, ex.: "020") | LITROS | PRECO_LITRO
// TIPO é opcional (adicionada em 2026-08-15): "DIESEL"/"ARLA"/"ARLA 32" etc. -- se a
// coluna não existir (arquivos gerados antes do Arla 32 existir), toda linha entra
// como DIESEL, igual sempre foi.
// Dedup por (data+prefixo+litros+preco) -- evita duplicar se o mesmo arquivo for
// importado duas vezes.
function _corrigirDimensaoPlanilha(ws){
  let minR=Infinity, maxR=-1, minC=Infinity, maxC=-1;
  const refOriginal = ws['!ref'];
  if(refOriginal){
    try{
      const range = XLSX.utils.decode_range(refOriginal);
      minR = range.s.r; maxR = range.e.r; minC = range.s.c; maxC = range.e.c;
    }catch(e){ /* !ref malformado -- ignora e recalcula só pelas células mesmo */ }
  }
  for(const chave in ws){
    if(chave[0]==='!') continue;
    const m = chave.match(/^([A-Z]+)([0-9]+)$/);
    if(!m) continue;
    const col = XLSX.utils.decode_col(m[1]);
    const row = parseInt(m[2],10)-1;
    if(row<minR) minR=row;
    if(row>maxR) maxR=row;
    if(col<minC) minC=col;
    if(col>maxC) maxC=col;
  }
  if(maxR<0) return;
  ws['!ref'] = XLSX.utils.encode_range({s:{r:minR,c:minC}, e:{r:maxR,c:maxC}});
}
function _cbParseData(v){
  if(v==null || v==='') return '';
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(!d) return '';
    return String(d.y).padStart(4,'0')+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0');
  }
  const s = String(v).trim();
  const mBr = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
  if(mBr){
    let [,d,m,y] = mBr;
    if(y.length===2) y = '20'+y;
    return y+'-'+m.padStart(2,'0')+'-'+d.padStart(2,'0');
  }
  const mIso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(mIso) return mIso[0];
  return '';
}
document.getElementById('fileInputFotos').addEventListener('change', async (ev)=>{
  const file = ev.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('uploadStatus');
  statusEl.textContent = 'Processando '+file.name+'...';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array', cellDates:false});
    const ws = wb.Sheets[wb.SheetNames[0]];
    _corrigirDimensaoPlanilha(ws);
    const aoa = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
    const header = (aoa[0]||[]).map(h=>String(h).trim().toUpperCase());
    const idx = {
      data: header.findIndex(h=>h.includes('DATA')),
      posto: header.findIndex(h=>h.includes('POSTO')),
      prefixo: header.findIndex(h=>h.includes('PREFIXO')||h.includes('CARRO')),
      // TIPO é opcional -- se a planilha não tiver essa coluna (arquivos antigos, de
      // antes do Arla 32 existir), assume DIESEL pra toda linha (comportamento anterior).
      tipo: header.findIndex(h=>h.includes('TIPO')),
      litros: header.findIndex(h=>h.includes('LITRO')),
      preco: header.findIndex(h=>h.includes('PRECO')||h.includes('PREÇO'))
    };
    if(idx.data<0 || idx.posto<0 || idx.prefixo<0 || idx.litros<0 || idx.preco<0){
      statusEl.textContent = 'ERRO: planilha não tem as colunas esperadas (DATA / POSTO / PREFIXO / LITROS / PRECO_LITRO).';
      ev.target.value = ''; return;
    }
    const chavesExistentes = new Set(DB.combustivel.map(r=> r.data+'|'+r.prefixo+'|'+r.litros+'|'+r.preco));
    let adicionados = 0, ignorados = 0;
    for(let i=1;i<aoa.length;i++){
      const linha = aoa[i];
      if(!linha || !linha.length) continue;
      const data = _cbParseData(linha[idx.data]);
      const posto = String(linha[idx.posto]||'').trim();
      const prefixo = String(linha[idx.prefixo]||'').trim().replace(/^\.+/,'');
      const tipoTexto = idx.tipo>=0 ? String(linha[idx.tipo]||'').trim().toUpperCase() : '';
      const tipo = tipoTexto.includes('ARLA') ? 'ARLA32' : 'DIESEL';
      const litros = parseFloat(linha[idx.litros]) || 0;
      const preco = parseFloat(linha[idx.preco]) || 0;
      if(!data || !posto || !prefixo || !litros || !preco) continue;
      const chave = data+'|'+prefixo+'|'+litros+'|'+preco;
      if(chavesExistentes.has(chave)){ ignorados++; continue; }
      const frota = FROTA_LISTA.find(f=>f.prefixo===prefixo);
      DB.combustivel.push({ id:'c'+Date.now()+Math.random().toString(36).slice(2,7)+i, data, posto, prefixo, tipo, placa: frota?frota.placa:'', litros, preco, valorTotal: _truncar2Casas(litros*preco) });
      chavesExistentes.add(chave);
      adicionados++;
    }
    await saveDB();
    _resetarFiltroCombustivelParaUltimoMes();
    renderCombustivel();
    statusEl.textContent = adicionados+' lançamento(s) importado(s)'+(ignorados?(', '+ignorados+' ignorado(s) por já existir'):'')+'.';
  }catch(e){
    console.error('Erro ao importar lançamentos por foto', e);
    statusEl.textContent = 'ERRO ao processar arquivo: '+e.message;
  }
  ev.target.value = '';
});
