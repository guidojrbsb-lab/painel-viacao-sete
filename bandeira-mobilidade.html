    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  header.hub-top{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; padding:16px 24px;
  }
  .btn{
    color:#fff; padding:9px 20px; border-radius:9px; text-decoration:none;
    font-weight:700; font-size:13px; transition:background .15s,border-color .15s;
  }
  .btn-voltar{ background:transparent; border:1.5px solid rgba(255,255,255,.5); }
  .btn-voltar:hover{ background:rgba(255,255,255,.12); border-color:#fff; }
  .btn-sair{ background:var(--dourado); color:#151b2b; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .btn-sair:hover{ background:var(--dourado-dark); }
  .logo-bandeira{ height:70px; width:auto; display:block; margin-bottom:28px; }
  h1{ color:#fff; font-size:24px; font-weight:800; text-align:center; margin:0 0 10px; }
  p{ color:#bcd2e6; font-size:14px; text-align:center; max-width:420px; margin:0; }
  .subtitulo{ color:#bcd2e6; font-size:14px; text-align:center; margin:0 0 44px; }

  /* Mesmo HUB (organograma) usado em viacao-sete.html (redesign 2026-10-01), aplicado
     aqui em 2026-10-03 com a paleta da Bandeira (azul/dourado no lugar de navy/red).
     Estrutura: DRE como card avulso ao lado do organograma INDICADORES (fixo, sem
     clique) + fileira dos demais setores (Comercial/Operação/Manutenção/Administrativo),
     todos no mesmo tamanho (.hub-card). Só DRE está disponível por enquanto -- os
     demais ficam "EM CONSTRUÇÃO" até cada painel próprio da Bandeira ser construído. */
  .hub-linha{
    display:flex; flex-direction:row; align-items:flex-end; gap:36px;
    justify-content:center; flex-wrap:wrap; max-width:1180px;
  }
  .hub-card{
    background:#fff; border-radius:18px; width:170px; padding:26px 16px 22px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    text-decoration:none; box-shadow:0 6px 20px rgba(0,0,0,.25);
    border-top:4px solid var(--azul); transition:transform .15s, box-shadow .15s;
  }
  .hub-card:hover{ transform:translateY(-4px); box-shadow:0 10px 28px rgba(0,0,0,.32); }
  .hub-card.indisponivel{ border-top-color:#9aa3b8; cursor:default; }
  .hub-icone{
    width:64px; height:64px; border-radius:14px; background:var(--azul);
    display:flex; align-items:center; justify-content:center;
  }
  .hub-card.indisponivel .hub-icone{ background:#5b6478; }
  .hub-icone svg{ width:34px; height:34px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .hub-nome{ font-size:15px; font-weight:800; color:var(--azul); text-align:center; letter-spacing:.3px; }
  .hub-tag{ font-size:10.5px; font-weight:700; color:#9aa1af; letter-spacing:.4px; }
  .hub-tag.ativo{ color:var(--azul); }

  /* Organograma INDICADORES: cabeca fixa (icone + texto, sem clique) + linhas
     de conexao + fileira dos 4 setores (mesmo .hub-card dos demais botoes). */
  .org-grupo{ display:flex; flex-direction:column; align-items:center; }
  .org-cabeca{ display:flex; flex-direction:column; align-items:center; gap:7px; margin-bottom:2px; }
  .org-cabeca-icone{
    width:50px; height:50px; border-radius:11px; background:var(--azul);
    display:flex; align-items:center; justify-content:center;
  }
  .org-cabeca-icone svg{ width:26px; height:26px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .org-cabeca-texto{ color:#fff; font-size:15px; font-weight:800; letter-spacing:.3px; }
  .org-chart-linha-topo{ width:2px; height:16px; background:rgba(255,255,255,.35); margin:0 auto; }
  .org-chart-linha-horizontal{ height:2px; background:rgba(255,255,255,.35); align-self:stretch; }
  .org-chart-filhos{ display:flex; flex-direction:row; gap:18px; justify-content:center; flex-wrap:wrap; }
  .org-chart-item{ display:flex; flex-direction:column; align-items:center; }
  .org-stem{ width:2px; height:14px; background:rgba(255,255,255,.35); }

  footer{ margin-top:48px; color:#8fa9bf; font-size:12px; text-align:center; }
</style>
