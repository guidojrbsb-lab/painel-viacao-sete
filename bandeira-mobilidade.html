<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bandeira Mobilidade &middot; Em Construção</title>
<style>
  /* Placeholder da empresa Bandeira Mobilidade (Grupo Bandeira Mobilidade), criado em
     2026-08-16. So existe essa tela por enquanto -- sem paineis proprios ainda. Segue
     o mesmo padrao visual do hub raiz (index.html), paleta do grupo (azul + dourado). */
  :root{
    --azul:#00579c; --azul-dark:#00304f; --azul-mid:#013f6b;
    --dourado:#efae25; --dourado-dark:#c98f11;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:var(--font);
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, rgba(239,174,37,.16) 0%, rgba(239,174,37,0) 60%),
      linear-gradient(160deg, var(--azul-mid) 0%, var(--azul-dark) 55%, #001b2e 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  header.hub-top{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; padding:16px 24px;
  }
  .btn{
    color:#fff; padding:9px 20px; border-radius:9px; text-decoration:none;
    font-weight:700; font-size:13px; transition:background .15s,border-color .15s;
  }
  .btn-voltar{ background:transparent; border:1.5px solid rgba(255,255,255,.5); }
  .btn-voltar:hover{ background:rgba(255,255,255,.12); border-color:#fff; }
  .btn-sair{ background:var(--dourado); color:#151b2b; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .btn-sair:hover{ background:var(--dourado-dark); }
  .logo-bandeira{ height:70px; width:auto; display:block; margin-bottom:28px; }
  .icone-grande{
    width:96px; height:96px; border-radius:20px; background:rgba(255,255,255,.12);
    display:flex; align-items:center; justify-content:center; margin-bottom:24px;
    border:1.5px solid rgba(255,255,255,.25);
  }
  .icone-grande svg{ width:52px; height:52px; stroke:var(--dourado); fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  h1{ color:#fff; font-size:24px; font-weight:800; text-align:center; margin:0 0 10px; }
  p{ color:#bcd2e6; font-size:14px; text-align:center; max-width:420px; margin:0; }
  footer{ margin-top:40px; color:#8fa9bf; font-size:12px; text-align:center; }
</style>
</head>
