<head>

<title>Painel de Indicadores Viação Sete</title>
<style>
  :root{ --navy:#132354; --navy-dark:#0c1938; --red:#b71930; --red-dark:#8f1226; }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(160deg, var(--navy) 0%, var(--navy-dark) 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:40px 20px;
  }
  header.hub-top{
    position:absolute; top:0; left:0; right:0; display:flex; align-items:center;
    justify-content:space-between; padding:16px 24px;
  }
  .btn{
    color:#fff; padding:9px 20px; border-radius:9px; text-decoration:none;
    font-weight:700; font-size:13px; transition:background .15s,border-color .15s;
  }
  .btn-voltar{ background:transparent; border:1.5px solid rgba(255,255,255,.5); }
  .btn-voltar:hover{ background:rgba(255,255,255,.12); border-color:#fff; }
  .btn-sair{ background:var(--red); box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .btn-sair:hover{ background:var(--red-dark); }
  .logo{ height:76px; width:auto; display:block; border-radius:14px; margin-bottom:22px;
    box-shadow:0 4px 14px rgba(0,0,0,.35); }
  .icone-grande{
    width:96px; height:96px; border-radius:20px; background:#5b6478;
    display:flex; align-items:center; justify-content:center; margin-bottom:24px;
  }
  .icone-grande svg{ width:52px; height:52px; stroke:#fff; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  h1{ color:#fff; font-size:24px; font-weight:800; text-align:center; margin:0 0 10px; }
  p{ color:#c7cee3; font-size:14px; text-align:center; max-width:420px; margin:0; }
  footer{ margin-top:40px; color:#8b93ad; font-size:12px; text-align:center; }
</style>
</head>
